name: Build Mod from Archive
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Archive
        run: |
          tar -xf WaifuCompanions-1.0.0-neoforge-1.21.1-src.tar.gz
          GRADLE_DIR=$(find . -name gradlew -exec dirname {} \;)
          if [ "$GRADLE_DIR" != "." ]; then
            echo "Moving files from $GRADLE_DIR to root..."
            mv $GRADLE_DIR/* . || true
            mv $GRADLE_DIR/.[!.]* . || true
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          # Принудительно передаем путь к Java 21, чтобы Gradle не путался в версиях
          ./gradlew build -Dorg.gradle.java.home=$JAVA_HOME_21_X64
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Upload Finished Mod
        uses: actions/upload-artifact@v4
        with:
          name: Finished-Mod-Jar
          path: build/libs/*.jar
