name: Build Mod from Archive
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Archive
        run: |
          tar -xf WaifuCompanions-1.0.0-neoforge-1.21.1-src.tar.gz
          # Переносим всё содержимое распакованной папки в корень для сборщика
          mv WaifuCompanions-1.0.0-neoforge-1.21.1-src/* . || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload Finished Mod
        uses: actions/upload-artifact@v4
        with:
          name: Finished-Mod-Jar
          path: build/libs/*.jar
